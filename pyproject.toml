[project]
name = "excel-mcp-server"
version = "0.1.0"
description = "MCP server for Excel automation and data manipulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0,<3",
    "pydantic>=2.12.5",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "python-calamine>=0.3.0",
    "numpy-financial>=1.0.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "pillow>=10.0",
    "httpx>=0.27.0",
]

[project.scripts]
excel-mcp = "mcp_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    # "rpytest>=0.1.0",
    "pytest>=8.3.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.9",
    "poethepoet>=0.48.0",
]

[tool.poe.tasks]
run-stdio = "uv run src/mcp_server/main.py"
run-http = "uv run excel-mcp --transport http"
test = "uv run pytest -v"
test-coverage = "uv run pytest -v --cov=src --cov-report=term-missing"
test-quick = "uv run pytest -v -x"
lint = "ruff check src/ tests/"
lint-fix = "ruff check src/ tests/ --fix"
format = "ruff format ."
type-check = "pyrefly check"
type-check-strict = "pyrefly check --min-severity error"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
extend-ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/mcp_server/main.py" = ["F401", "I001"]

[tool.pyrefly]
# Root as search path so 'src.' prefixed imports resolve.
search-path = ["."]
python-version = "3.12"
project-includes = ["src/mcp_server"]
project-excludes = ["tests/"]
# Third-party packages without type stubs. mypy previously ignored these via
# ignore_missing_imports; replace-imports-with-any reproduces that behaviour.
replace-imports-with-any = [
    "openpyxl.*",
    "calamine.*",
    "numpy_financial.*",
    "scipy.*",
    "statsmodels.*",
    "pandas.*",
    "numpy.*",
    "dateutil.*",
]
