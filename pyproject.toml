[project]
name = "excel-mcp-server"
version = "0.1.0"
description = "MCP server for Excel automation and data manipulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.24.0",
    "pydantic>=2.12.5",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "python-calamine>=0.3.0",
    "numpy-financial>=1.0.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "pillow>=10.0",
]

[project.scripts]
excel-mcp = "mcp_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=8.3.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
    "calamine.*",
    "numpy_financial.*",
    "scipy.*",
    "statsmodels.*",
    "pandas.*",
]
ignore_missing_imports = true
